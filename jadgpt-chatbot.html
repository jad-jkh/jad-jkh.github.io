<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JadGPT - AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-purple: #9945FF;
            --accent-pink: #FF6EC7;
            --accent-yellow: #FFD700;
            --dark-navy: #2C3E50;
            --darker-navy: #1a252f;
            --bg-light: #ecf0f1;
            --text-dark: #2c3e50;
            --text-light: #ecf0f1;
            --border-thick: #000;
            --success: #00ff41;
        }

        body {
            font-family: 'VT323', monospace;
            background: transparent;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* Chat Container */
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 600px;
            background: white;
            border: 6px solid var(--border-thick);
            box-shadow: 12px 12px 0px var(--border-thick);
            display: flex;
            flex-direction: column;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9998;
            transform-origin: bottom right;
            animation: expandFromButton 0.25s ease-out forwards;
        }

        .chat-container.closing {
            animation: collapseToButton 0.25s ease-in forwards;
        }

        @keyframes expandFromButton {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes collapseToButton {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, var(--primary-purple) 0%, var(--accent-pink) 100%);
            padding: 20px;
            border-bottom: 6px solid var(--border-thick);
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            color: white;
            text-shadow: 3px 3px 0px var(--border-thick);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .chat-header p {
            font-size: 18px;
            color: white;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
        }

        .close-button {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            background: white;
            border: 3px solid var(--border-thick);
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--text-dark);
        }

        .close-button:hover {
            background: var(--accent-yellow);
            transform: rotate(90deg);
        }

        /* Navigation Menu */
        .nav-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
            background: var(--bg-light);
            border-bottom: 4px solid var(--border-thick);
        }

        .nav-button {
            background: white;
            border: 4px solid var(--border-thick);
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 4px 4px 0px var(--border-thick);
            color: var(--text-dark);
            text-align: center;
            line-height: 1.4;
        }

        .nav-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border-thick);
            background: var(--accent-yellow);
        }

        .nav-button:active {
            transform: translate(1px, 1px);
            box-shadow: 3px 3px 0px var(--border-thick);
        }

        .nav-button.active {
            background: var(--primary-purple);
            color: white;
        }

        /* Sub Menu */
        .sub-menu {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(153, 69, 255, 0.1);
            border-bottom: 4px solid var(--border-thick);
        }

        .sub-menu.active {
            display: flex;
        }

        .sub-menu-button {
            background: white;
            border: 3px solid var(--border-thick);
            padding: 8px 12px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 3px 3px 0px var(--border-thick);
            color: var(--text-dark);
            text-align: left;
        }

        .sub-menu-button:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-thick);
            background: var(--accent-yellow);
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: white;
        }

        .chat-messages::-webkit-scrollbar {
            width: 10px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--bg-light);
            border-left: 3px solid var(--border-thick);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-purple);
            border: 2px solid var(--border-thick);
        }

        /* Message Bubbles */
        .message {
            display: flex;
            gap: 12px;
            animation: messageSlide 0.2s ease-out;
            max-width: 90%;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border: 3px solid var(--border-thick);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            background: white;
            box-shadow: 3px 3px 0px var(--border-thick);
        }

        .message.user .message-avatar {
            background: var(--accent-yellow);
            color: var(--text-dark);
        }

        .message.assistant .message-avatar {
            background-color: var(--primary-purple);
            background-image: url('/images/AI_pixel_floating.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            color: transparent;
        }

        .message-content {
            background: white;
            padding: 12px 14px;
            border: 3px solid var(--border-thick);
            box-shadow: 3px 3px 0px var(--border-thick);
            font-size: 18px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: var(--bg-light);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 8px;
            padding: 12px;
        }

        .typing-dot {
            width: 10px;
            height: 10px;
            background: var(--primary-purple);
            border: 2px solid var(--border-thick);
            animation: typing 1.2s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* Input Area */
        .chat-input-container {
            padding: 16px;
            background: var(--dark-navy);
            border-top: 6px solid var(--border-thick);
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: white;
            border: 3px solid var(--border-thick);
            padding: 12px 14px;
            color: var(--text-dark);
            font-family: 'VT323', monospace;
            font-size: 18px;
            outline: none;
        }

        .chat-input:focus {
            box-shadow: 0 0 0 3px var(--primary-purple);
        }

        .send-button {
            background: var(--accent-yellow);
            border: 3px solid var(--border-thick);
            color: var(--text-dark);
            padding: 12px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 3px 3px 0px var(--border-thick);
            font-weight: bold;
        }

        .send-button:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-thick);
            background: var(--primary-purple);
            color: white;
        }

        .send-button:active:not(:disabled) {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px var(--border-thick);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 24px 16px;
        }

        .welcome-message h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--primary-purple);
            line-height: 1.5;
        }

        .welcome-message p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        /* Error Message */
        .error-message {
            background: #ffebee;
            border: 3px solid #c62828;
            padding: 12px;
            margin: 12px 0;
            font-size: 16px;
            color: #c62828;
            box-shadow: 3px 3px 0px var(--border-thick);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .chat-container {
                width: calc(100vw - 20px);
                height: 70vh;
                max-width: calc(100vw - 20px);
                bottom: 10px;
                right: 10px;
                border: 4px solid var(--border-thick);
                box-shadow: 8px 8px 0px var(--border-thick);
            }

            .chat-header {
                padding: 16px;
            }

            .chat-header h1 {
                font-size: 18px;
            }

            .chat-header p {
                font-size: 14px;
            }

            .nav-button {
                font-size: 10px;
                padding: 10px 8px;
            }

            .message-content {
                font-size: 16px;
            }

            .send-button {
                padding: 12px 16px;
                font-size: 10px;
            }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>
</head>

        const messagesContainer = document.getElementById('chatMessages');

        // Configuration for widget mode

        function closeChat() {
            const container = document.getElementById('chatContainer');
            container.classList.add('closing');
            
            setTimeout(() => {
                container.style.display = 'none';
                container.classList.remove('closing');
                window.parent.postMessage('closeChat', '*');
            }, 250);
        }

        function openChat() {
            const container = document.getElementById('chatContainer');
            container.style.display = 'flex';
        }

        window.addEventListener('message', function(event) {
            if (event.data === 'openChat') {
                openChat();
            }
        });

        function handleNavClick(category, event) {
            // Hide all sub menus first
            document.querySelectorAll('.sub-menu').forEach(menu => {
                menu.classList.remove('active');
            });

            // Remove active state from all nav buttons
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Handle category-specific logic
            if (category === 'projects') {
                document.getElementById('projectsSubMenu').classList.add('active');
                event.target.classList.add('active');
                currentSubMenu = 'projects';
            } else if (category === 'experience') {
                document.getElementById('experienceSubMenu').classList.add('active');
                event.target.classList.add('active');
                currentSubMenu = 'experience';
            } else if (category === 'leadership') {
                document.getElementById('leadershipSubMenu').classList.add('active');
                event.target.classList.add('active');
                currentSubMenu = 'leadership';
            } else {
                currentSubMenu = null;
                // Ask about the category directly

                    askAbout('Tell me about Jad\'s education at Texas A&M');
                } else if (category === 'skills') {
                    askAbout('What are Jad\'s technical skills and certifications?');

            }
        }

        function askAbout(question) {
            // Close all sub-menus when a question is asked
            document.querySelectorAll('.sub-menu').forEach(menu => {
                menu.classList.remove('active');
            });
            
            // Remove active state from all nav buttons
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            currentSubMenu = null;
            
            userInput.value = question;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message) return;

            // Remove welcome message if it exists
            const welcomeMsg = document.querySelector('.welcome-message');
            if (welcomeMsg) welcomeMsg.remove();

            addMessage(message, true);
            
            userInput.value = '';
            sendButton.disabled = true;
            userInput.disabled = true;
            
            showTypingIndicator();

            // Simulate thinking delay
            setTimeout(async () => {
                const response = getAIResponse(message);
                removeTypingIndicator();
                addMessage(response, false);
                
                // Log to analytics (non-blocking)
                logConversation(message, response);
                
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }, 800);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Auto-focus input
        setTimeout(() => {
            document.getElementById('userInput').focus();
        }, 300);
