    <!-- jadSim card: flat, under the hero buttons, same width as that row -->
    <style>
      .jadsim-row { display: grid; gap: 1.25rem; width: fit-content; max-width: 100%; }
      .jadsim-card {
        display: flex; align-items: center; justify-content: center; gap: .75rem;
        padding: .6rem 1rem; background: #fff; color: #000; text-decoration: none;
        border: 4px solid #000; box-shadow: 6px 6px 0 rgba(0,0,0,.3);
        transition: transform .15s, box-shadow .15s, background .15s;
      }
      .jadsim-card:hover, .jadsim-card:focus-visible { background: #bae6fd; transform: translateY(-4px); box-shadow: 8px 8px 0 rgba(0,0,0,.4); }
      .jadsim-card img { width: 32px; height: 32px; flex-shrink: 0; }
      .jadsim-card > span { display: flex; flex-direction: column; gap: .35rem; line-height: 1.15; text-align: left; min-width: 0; }
      .jadsim-card b { font-family: var(--font-display); font-size: 12px; }
      .jadsim-card small { font-size: 12px; font-weight: 600; color: #444; }
      .jadsim-phone { display: none; }
      @media (max-width: 767px) {
        .jadsim-row { margin: 0 auto; }
        .jadsim-desktop { display: none; }
        .jadsim-phone { display: inline; }
      }
      /* Desktop nav: jadSim shows as just its logo until there's room for the label */
      @media (max-width: 1279px) { .nav-jadsim-label { display: none; } }
    </style>

    <!-- POLISH: cleanup layer. Each numbered rule is independent; delete a rule (or this whole block) to undo it. -->
    <style id="polish">
      /* 1. Hero: hide the "B.S. in Electronic Systems Engineering" and "Embedded Systems & Hardware Design" badges */
      .hero-badges { display: none !important; }

      /* 2. Hero copy: plain readable dark text with a soft white halo, scroll prompt */
      #hero { padding-bottom: 5rem; --hero-ink: #111827; --hero-halo: rgba(255,255,255,.95); --hero-wash: rgba(255,255,255,.72); --hero-wash-mid: rgba(255,255,255,.5); }
      #hero h1 { margin-bottom: 1.25rem; }
      .hero-tagline {
        max-width: 36rem; margin: 0 0 2rem; font-family: "Inter", system-ui, sans-serif; color: var(--hero-ink);
        text-shadow: 0 0 2px var(--hero-halo), 0 0 6px var(--hero-halo), 0 0 14px var(--hero-halo), 0 0 24px var(--hero-halo);
      }
      .hero-tagline strong { display: block; font-weight: 700; font-size: clamp(1.2rem, 1.6vw, 1.45rem); line-height: 1.35; letter-spacing: -.01em; }
      .hero-tagline span { display: block; margin-top: .7rem; font-weight: 500; font-size: 1.02rem; line-height: 1.6; }
      .hero-scroll {
        position: absolute; left: 50%; top: calc(100svh - 4.25rem); translate: -50% 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; gap: .35rem; cursor: pointer;
        font-family: var(--font-display); font-size: 10px; text-transform: uppercase;
        color: var(--hero-ink); text-shadow: 0 0 2px var(--hero-halo), 0 0 8px var(--hero-halo);
      }
      .hero-scroll span { font-size: 18px; animation: hero-bob 1.6s steps(2) infinite; }
      @keyframes hero-bob { 50% { transform: translateY(5px); } }
      @media (max-width: 767px) {
        .hero-tagline { margin-left: auto; margin-right: auto; }
        .hero-scroll { top: auto; bottom: 1.5rem; }
      }

      /* 3. Hero background: four pixel-art scenes (Aero day, golden sunrise, red sunset, meadow) cross-fading every 9s
            over the checkerboard, each slowly panning. A soft wash behind the text keeps it readable. */
      #hero > div.absolute.inset-0 { overflow: hidden; }
      #hero > div.absolute.inset-0 > div:first-child { display: none; }
      #hero > div.absolute.inset-0 > div:not(:first-child):not(:last-child) {
        inset: -6% !important; opacity: 0; image-rendering: pixelated;
        background-position: center !important; background-size: cover !important; background-repeat: no-repeat !important;
      }
      #hero > div.absolute.inset-0 > div:nth-child(2) { background-image: url("./images/hero-scene-day.png") !important;     animation: scene-show 36s linear 0s infinite, scene-pan 40s ease-in-out 0s infinite alternate !important; }
      #hero > div.absolute.inset-0 > div:nth-child(3) { background-image: url("./images/hero-scene-sunrise.png") !important; animation: scene-show 36s linear -27s infinite, scene-pan 40s ease-in-out -10s infinite alternate !important; }
      #hero > div.absolute.inset-0 > div:nth-child(4) { background-image: url("./images/hero-scene-sunset.png") !important;  animation: scene-show 36s linear -18s infinite, scene-pan 40s ease-in-out -20s infinite alternate !important; }
      #hero > div.absolute.inset-0 > div:nth-child(5) { background-image: url("./images/hero-scene-meadow.png") !important;  animation: scene-show 36s linear -9s infinite, scene-pan 40s ease-in-out -30s infinite alternate !important; }
      @keyframes scene-show { 0%, 22% { opacity: .78; } 25%, 97% { opacity: 0; } 100% { opacity: .78; } }
      @keyframes scene-pan { from { transform: translateX(-3%); } to { transform: translateX(3%); } }
      /* readability: a soft light wash that fades in from the text side (no box) */
      #hero > div.absolute.inset-0::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(90deg, var(--hero-wash) 0%, var(--hero-wash-mid) 38%, transparent 62%);
      }
      @media (max-width: 767px) {
        #hero > div.absolute.inset-0::after { background: linear-gradient(180deg, transparent 0%, transparent 32%, var(--hero-wash-mid) 44%, var(--hero-wash) 60%, var(--hero-wash) 100%); }
      }

      /* SPACE THEME: on while <html> has data-hero="space". Delete that attribute in index.html to go back to the sky scenes. */
      html[data-hero="space"] #hero { --hero-ink: #f8fafc; --hero-halo: rgba(2,6,23,.95); --hero-wash: rgba(2,6,23,.72); --hero-wash-mid: rgba(2,6,23,.5); }
      html[data-hero="space"] #hero h1 { color: #cbd5e1; }
      html[data-hero="space"] #hero > div.absolute.inset-0 { background: #050816; }
      html[data-hero="space"] #hero > div.absolute.inset-0 > div:nth-child(2) { background-image: url("./images/hero-scene-earthrise.png") !important; }
      html[data-hero="space"] #hero > div.absolute.inset-0 > div:nth-child(3) { background-image: url("./images/hero-scene-nebula.png") !important; }
      html[data-hero="space"] #hero > div.absolute.inset-0 > div:nth-child(4) { background-image: url("./images/hero-scene-saturn.png") !important; }
      html[data-hero="space"] #hero > div.absolute.inset-0 > div:nth-child(5) { background-image: url("./images/hero-scene-solar.png") !important; }

      /* 4. Type: Inter for body copy in the content cards; the hero stays fully retro (VT323 + pixel headings) */
      body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 1rem; letter-spacing: -.005em; }
      #hero { font-family: var(--font-body); font-size: 1.25rem; letter-spacing: 0; }
      #hero .jadsim-card small { font-family: var(--font-body); font-size: 15px; font-weight: 400; }

      /* 5. (removed: nav restyle, back to the original white pixel buttons) */

      /* 6. Skills: drop the emoji icons in the card corners and on certifications */
      #skills .absolute.top-3.right-3,
      #skills .flex.items-center > .text-2xl:first-child { display: none; }

      /* 7. Experience & leadership cards on phones: logo above the title, no mid-word breaks, full-width card */
      @media (max-width: 767px) {
        :is(#experience, #leadership) .relative.pl-8 { padding-left: 0; }
        :is(#experience, #leadership) .w-1.bg-black { display: none; }
        :is(#experience, #leadership) .flex.items-start.gap-3 { flex-direction: column; gap: .75rem; }
        :is(#experience, #leadership) h3 { font-size: 14px !important; line-height: 1.45; overflow-wrap: normal !important; word-break: normal !important; padding-right: 1.5rem; }
        :is(#experience, #leadership) .md\:hidden.inline-block { white-space: nowrap; font-size: 10px; }
      }

      /* 8. Hero buttons on phones: Resume + LinkedIn share a row, ZKK gets its own, every row the same full width */
      @media (max-width: 767px) {
        #hero .jadsim-row > div { justify-content: center; }
        #hero .jadsim-row { width: 100%; }
        #hero .jadsim-row > div > a { flex: 1 1 0; justify-content: center; padding-left: 1.1rem; padding-right: 1.1rem; }
        #hero .jadsim-row > div > a.zkk-cta { flex-basis: 100%; justify-content: center; }
      }

      /* 11. Bigger, calmer checkerboard behind the whole site (was 20px squares) */
      body { background-size: 80px 80px; background-position: 0 0, 0 40px, 40px -40px, -40px 0; }

      /* 12. "View Experience" popup on phones: logo above the title, no mid-word breaks, tighter spacing,
             and nothing floating on top of it while it's open */
      body:has(.exp-modal) .jadgpt-chat-button, body:has(.exp-modal) .hero-scroll { display: none !important; }
      @media (max-width: 767px) {
        .exp-modal { max-height: 92vh; }
        .exp-modal > div.flex.items-start { flex-direction: column; gap: .75rem; padding: 1rem 3.75rem 1rem 1rem !important; }
        .exp-modal > button[aria-label="Close"] { top: .75rem; right: .75rem; }
        .exp-modal h2 { font-size: 16px !important; line-height: 1.45; overflow-wrap: normal !important; word-break: normal !important; }
        .exp-modal > div.flex.items-start p { font-size: 13px; line-height: 1.4; }
        .exp-modal > div.p-6 { padding: 1rem; }
        .exp-modal ul { font-size: 1rem; line-height: 1.5; }
        .exp-modal ul li { gap: .5rem; }
      }

      /* 13. Performance: pause the hero scene animations while the hero is scrolled out of view (see script below) */
      html.hero-offscreen #hero *, html.hero-offscreen #hero *::before, html.hero-offscreen #hero *::after { animation-play-state: paused !important; }
      html.hero-offscreen #hero > div.absolute.inset-0 > div:nth-child(n) { animation-play-state: paused !important; }

      /* 14. Project cards on phones: stack View Project / GitHub full-width so the labels never wrap */
      @media (max-width: 767px) {
        #projects .grid.grid-cols-2.gap-2 { grid-template-columns: 1fr; }
        #projects .grid.gap-2 > :is(a, button) { white-space: nowrap; }
      }

      /* 15. jadSim product section above the footer: demo footage under a jadSim-blue tint,
             pitch on the left, all three recorded demos playing small on the right */
      .jadsim-section { position: relative; overflow: hidden; border-top: 4px solid #000; padding: 6rem 1rem; color: #fff; }
      .jadsim-section-bg { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; filter: blur(3px) saturate(1.2); }
      .jadsim-section-tint { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(14,165,233,.9) 0%, rgba(2,132,199,.9) 55%, rgba(3,105,161,.94) 100%); }
      .jadsim-section-inner { position: relative; max-width: 74rem; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 1fr; gap: 3.5rem; align-items: center; }
      .jadsim-section-brand { display: flex; align-items: center; gap: 1.1rem; }
      .jadsim-section-brand img { width: 76px; height: 76px; border: 4px solid #000; border-radius: 16px; box-shadow: 6px 6px 0 #000; }
      .jadsim-section-brand h2 {
        font-size: clamp(2.6rem, 5vw, 4.5rem); text-transform: none; color: #fff; letter-spacing: 0;
        -webkit-text-stroke: 4px #000; paint-order: stroke fill; text-shadow: 6px 6px 0 #000;
      }
      .jadsim-section-tag { margin-top: 1rem; font-family: var(--font-display); font-size: clamp(11px, 1.1vw, 14px); text-transform: uppercase; color: #fde047; text-shadow: 2px 2px 0 #000; }
      .jadsim-section-pitch { max-width: 34rem; margin-top: 1.25rem; font-size: 1.12rem; line-height: 1.6; color: #f0f9ff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
      .jadsim-section-chips { display: flex; flex-wrap: wrap; gap: .55rem; margin: 1.75rem 0 2.25rem; padding: 0; list-style: none; }
      .jadsim-section-chips li { background: #fff; color: #000; border: 2px solid #000; box-shadow: 3px 3px 0 #000; padding: .3rem .65rem; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      .jadsim-section-cta {
        display: inline-flex; align-items: center; padding: 1.05rem 1.9rem; background: #fff; color: #000; text-decoration: none;
        border: 4px solid #000; box-shadow: 8px 8px 0 #000; font-family: var(--font-display); font-size: 14px;
        transition: transform .15s, box-shadow .15s, background .15s;
      }
      .jadsim-section-cta:hover { background: #fde047; transform: translate(-3px, -3px); box-shadow: 11px 11px 0 #000; }
      .jadsim-demos { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
      .jadsim-demo { margin: 0; background: #000; border: 3px solid #000; box-shadow: 6px 6px 0 #000; }
      .jadsim-demo:first-child { grid-column: 1 / -1; }
      .jadsim-demo video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #f8fafc; }
      .jadsim-demo figcaption { padding: .45rem .6rem; background: #111827; color: #e5e7eb; font-family: var(--font-display); font-size: 9px; }
      @media (max-width: 900px) {
        .jadsim-section { padding: 4rem 1rem; }
        .jadsim-section-inner { grid-template-columns: 1fr; gap: 2.5rem; }
        .jadsim-section-brand img { width: 60px; height: 60px; border-radius: 13px; }
        .jadsim-section-pitch { font-size: 1rem; }
        .jadsim-section-cta { width: 100%; justify-content: center; font-size: 11px; padding: 1rem .75rem; }
      }

      /* 9. Keyboard users: a clear focus ring on every link and button */
      a:focus-visible, button:focus-visible { outline: 3px solid #0ea5e9 !important; outline-offset: 3px; }

      /* 10. Respect "reduce motion" system setting for CSS animations */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      }
    </style>

  </head>
  <body>
    <div id="root"></div>

    <!-- JadGPT Chat Widget -->
    <iframe 
        id="jadgpt-widget"
        src="./jadgpt-chatbot.html?widget=true" 
        style="position: fixed; bottom: 0; right: 0; width: 100%; height: 100%; border: none; pointer-events: none; z-index: 9999; display: none;"
    ></iframe>

    <style>
        .jadgpt-chat-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #9945FF 0%, #FF6EC7 100%);
            border: 4px solid #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 6px 6px 0px #000, 0 0 30px rgba(153, 69, 255, 0.6);
            z-index: 9998;
            animation: pulse 2s infinite;
            rotate: 0deg;
            transition: rotate 0.4s ease, scale 0.4s ease;
        }

        .jadgpt-chat-button:hover {
            animation: pulse-hover 2s infinite;
            rotate: -5deg;
        }

        @keyframes pulse {
            0%, 100% { scale: 1; }
            50% { scale: 1.05; }
        }

        @keyframes pulse-hover {
            0%, 100% { scale: 1.05; }
            50% { scale: 1.2; }
        }
    </style>

    <button class="jadgpt-chat-button" onclick="toggleJadGPT()" style="flex-direction: column;">
        <span style="
            display: inline-block;
            width: 35px;
            height: 35px;
            background: url('./assets/AI_pixel_head_only-sm.png') no-repeat center 10%;
            background-size: contain;
        "></span>
        <span style="font-size: 8px; font-family: 'Press Start 2P'; margin-top: -4px;">JadGPT</span>
    </button>

    <script>
        function toggleJadGPT() {
            const widget = document.getElementById('jadgpt-widget');
            const button = document.querySelector('.jadgpt-chat-button');
            
            widget.style.display = 'block';
            widget.style.pointerEvents = 'all';
            button.style.display = 'none';
            
            setTimeout(() => {
                widget.contentWindow.postMessage('openChat', '*');
            }, 50);
        }

        window.addEventListener('message', function(event) {
            if (event.data === 'closeChat') {
                const widget = document.getElementById('jadgpt-widget');
                const button = document.querySelector('.jadgpt-chat-button');
                
                widget.style.display = 'none';
                widget.style.pointerEvents = 'none';
                button.style.display = 'flex';
            }
        });
    </script>

    <script>
      // Pause the hero's background animations while it's off screen; resume as soon as it scrolls back in
      (function(){
        // scroll events already fire at most once per frame, so this check is cheap
        var root = document.documentElement, off = false;
        window.addEventListener('scroll', function(){
          var hero = document.getElementById('hero'); if (!hero) return;
          var o = hero.getBoundingClientRect().bottom < 0;
          if (o !== off) { off = o; root.classList.toggle('hero-offscreen', o); }
        }, { passive: true });
      })();
    </script>

    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

  </body>
</html>
